services:
  blockfall:                         # site web (PHP 8.5 + Apache)
    build: .
    ports:
      - "8095:80"
    environment:
      # URL WebSocket vue par le navigateur ; vide = même hôte, port 8081 (ou /ws derrière HTTPS)
      BLOCKFALL_WS: "ws://localhost:8096"
    volumes:
      - data:/var/www/html/data
    restart: unless-stopped

  blockfall-ws:                      # serveur de jeu multijoueur (même image, autre commande)
    build: .
    command: ["php", "/opt/blockfall/server.php"]
    ports:
      - "8096:8081"
    volumes:
      - data:/var/www/html/data   # classement (écrit ici, lu par le site)
    environment:
      WS_PORT: "8081"
      WS_ALLOWED_ORIGINS: ""     # ex. "https://blockfall.exemple.fr" pour restreindre
    restart: unless-stopped

volumes:
  data:
